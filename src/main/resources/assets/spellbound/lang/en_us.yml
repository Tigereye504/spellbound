enchantment:
    spellbound:
        acceleration:
            .: Acceleration
            desc: Type:Efficiency. Mining speed increases during use.
        airline:
            .: Airline
            desc: Type:Utility. Drags the user behind fired projectile.
        attractive:
            .: Attractive
            desc: Type:Utility. Attracts nearby entities.
        buffered:
            .: Buffered
            desc: Type:Durability. Protects durability with regenerating buffer.
        cave_in:
            .: Cave-In
            desc: Type:Utility. Shot blocks fall to the ground
        chilled:
            .: Chilled
            desc: Type:Utility. Freeze adjacent blocks on break
        death_wish:
            .: Death Wish
            desc: Type:Protection. Provides no protection. Greatly increases damage.
        despoiling:
            .: Despoiling
            desc: Type:Looting. Triggers kill streaks, and has better looting during kill streaks
        demolition:
            .: Demolition
            desc: Type:Efficiency. Creates explosions when mining. Hard on your tool.
        dullness:
            .: Dullness
            desc: Type:Damage. Reduces damage done by tool.
        fisher_of_men:
            .: Fisher Of Men
            desc: Type:Lure. Deals damage to pulled entities and grants fish if lethal.
        flesh_wound:
            .: Flesh Wound
            desc: Type:Protection. Grants absorption hearts when injured.
        goldskin:
            .: Goldskin
            desc: Type:Protection. Grants absorption hearts that regenerate out of combat.
        grace:
            .: Grace
            desc: Type:Protection. Greatly extends and improves I-Frames.
        hearty:
            .: Hearty
            desc: Type:Protection. Greatly increases max health.
        hover:
            .: Hover
            desc: Type:Utility. Hold elevation briefly upon midair jump.
        impersonal:
            .: Impersonal
            desc: Type:Utility. Teleports user behind targets.
        jousting:
            .: Jousting
            desc: Type:Damage. Increase damage with relative velocity.
        last_gasp:
            .: Last Gasp
            desc: Type:Protection. Enter dying state on lethal damage, recover on kill.
            message:
                dying: Fight For Your Life!
        launching:
            .: Launching
            desc: Type:Utility. Knock targets skyward.
        legacy:
            .: Legacy
            desc: Type:Repair. Creates enchanted book when item breaks.
        metabolising:
            .: Metabolising
            desc: Type:Repair. Consumes hunger to restore durability.
        mounted:
            .: Mounted
            desc: Type:Damage. Increase damage while mounted.
        monogamous:
            .: Monogamous
            desc: Type:Personality. Increases power with no other bonded items.
        outburst:
            .: Outburst
            desc: Type:Retaliation. Burst free when hit multiple times.
        pestilence:
            .: Pestilence
            desc: Type:Retaliation. Spread status effects to nearby foes and damage them.
        phase_leap:
            .: Phase Leap
            desc: Type:Utility. Phase forward upon midair jump.
        phase_strafe:
            .: Phase Strafe
            desc: Type:Utility. Phase with your motion upon midair jump.
        photosynthetic:
            .: Photosynthetic
            desc: Type:Repair. Restores itself in the light.
        pinata:
            .: Pinata
            desc: Type:Looting. Large but infrequent loot explosions.
            tooltip: Reward in %d kills
            message:
                countdown: Reward in %d kills
                nextKill: Reward Imminent!
        priming:
            .: Priming
            desc: Type:Damage. Sets target to explode. Multiple hits increase yield.
        prospector:
            .: Prospector
            desc: Type:Fortune. Find trace minerals in earth, more if near ore.
        rampage:
            .: Rampage
            desc: Type:Damage. Massive damage after kills.
        red_alert:
            .: Red Alert
            desc: Type:Protection. Barriers negate next damage source.
        repulsive:
            .: Repulsive
            desc: Type:Utility. Repulses nearby entities
        resurfacing:
            .: Resurfacing
            desc: Type:Repair. Returns as treasure when lost or broken.
        rock_collecting:
            .: Rock Collecting
            desc: Type:Efficiency. Mining speed grows with unique rocks mined.
        saturated:
            .: Saturated
            desc: Type:Durability. Consumes saturation instead of durability.
        scalping:
            .: Scalping
            desc: Type:Looting. Attacks tear free bonus drops, scaling with damage.
        selfish:
            .: Selfish
            desc: Type:Durability/Repair. Takes durability from other equipment.
        skotosynthetic:
            .: Skotosynthetic
            desc: Type:Repair. Restores itself in the night.
        spikes:
            .: Spikes
            desc: Type:Retaliation. Damages very close entities.
        storied:
            .: Storied
            desc: Type:Metamagic. Upgrades and adds enchantments as the item's story develops.
        sunken_treasure:
            .: Sunken Treasure
            desc: Type:Fortune. Finds crates while fishing.
        tethering:
            .: Tethering
            desc: Type:Utility. Pulls target to weapon.
        trophy_collecting:
            .: Trophy Collecting
            desc: Type:Damage. Damage grows with unique foes slain.
        universal:
            .: Universal
            desc: Type:Utility. Tool is suitable for all blocks, with speed penalty for off-type blocks.
        vengeful:
            .: Vengeful
            desc: Type:Retaliation. Built up damage becomes followup strikes when user strikes back.
        warlike:
            .: Warlike
            desc: Type:Utility. Declares war upon the world, increasing difficulty.
        widened:
            .: Widened
            desc: Type:Efficiency. Tool breaks matching blocks in small plane around target.
